version: "3.9"
services:
  agate-gateway:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - ./gateway:/app
    command: sh -c "pip install -r requirements.txt && uvicorn main:app --host 0.0.0.0 --port 8090"
    ports:
      - "8090:8090"
    environment:
      - OPA_URL=http://opa:8181/v1/data/agate/allow
      - PRESIDIO_URL=http://presidio:3000/analyze
      # Optional Lakera endpoint:
      # - LAKERA_URL=https://api.lakera.ai/v2/guard
      # - LAKERA_API_KEY=...
    depends_on:
      - opa
      - presidio

  opa:
    image: openpolicyagent/opa:0.68.0
    command: ["run", "--server", "--addr=0.0.0.0:8181", "/policies/agate.rego"]
    volumes:
      - ./policies:/policies
    ports:
      - "8181:8181"

  presidio:
    image: mcr.microsoft.com/presidio-analyzer:latest
    ports:
      - "3000:3000"
